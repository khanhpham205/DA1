<h1> element body</h1>
<script>
    //lab2.1
    const events = new Map([
  [17, '⚽ GOAL'],
  [36, '🔁 Substitution'],
  [47, '⚽ GOAL'],
  [61, '🔁 Substitution'],
  [64, '🔶 Yellow card'],
  [69, '🔴 Red card'],
  [70, '🔁 Substitution'],
  [72, '🔁 Substitution'],
  [76, '⚽ GOAL'],
  [80, '⚽ GOAL'],
  [92, '🔶 Yellow card']
]);

// 1. Tạo mảng sự kiện không trùng lặp
const uniqueEvents = [...new Set(events.values())];
console.log("Unique events:", uniqueEvents);

// 2. Xóa thẻ vàng ở phút 64
events.delete(64);

// 3. Tính trung bình và in ra console
const time = [...events.keys()].pop(); // Lấy thời gian cuối của trận đấu
console.log(`1 sự kiện xảy ra, trung bình mỗi ${time / events.size} phút.`);

// 4. Phân loại và in các sự kiện theo hiệp
for (const [minute, event] of events) {
  const half = minute <= 45 ? 'FIRST HALF' : 'SECOND HALF';
  console.log(`[${half}] ${minute}: ${event}`);
}
//lab2.2
    // HTML phần giao diện
document.body.append(document.createElement('textarea'));
document.body.append(document.createElement('button'));

    // Chức năng chuyển đổi
document.querySelector('button').addEventListener('click', function() {
  const text = document.querySelector('textarea').value; // Lấy đầu vào từ người dùng
  const lines = text.split('\n'); // Tách mỗi dòng thành 1 phần tử trong mảng

  for (const [i, line] of lines.entries()) {
    // Tách các từ dựa vào dấu _
    const [first, second] = line.toLowerCase().trim().split('_');
    
    // Chuyển sang camelCase
    const camelCase = first + second[0].toUpperCase() + second.slice(1);

    // In ra kết quả và thêm dấu tick
    console.log(`${camelCase.padEnd(20)}${'✅'.repeat(i + 1)}`);
  }
});
//lab2.3
const flights =
'_Delayed_Departure;fao93766109;txl2133758440;11:25+_Arrival;bru0943384722;fao93766109;11:45+_Delayed_Arrival;hel7439299980;fao93766109;12:05+_Departure;fao93766109;lis2323639855;12:30';
// 🔴 Delayed Departure from FAO to TXL (11h25)
// Arrival from BRU to FAO (11h45)
// 🔴 Delayed Arrival from HEL to FAO (12h05)
// Departure from FAO to LIS (12h30)
const getCode = str => str.slice(0, 3).toUpperCase();
for (const flight of flights.split('+')) {
const [type, from, to, time] = flight.split(';');
const output = `${type.startsWith('_Delayed') ? '🔴' : ''}${type.replaceAll(
'_',
' '
)} ${getCode(from)} ${getCode(to)} (${time.replace(':', 'h')})`.padStart(36);
console.log(output);
}
