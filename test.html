<?php
// Bắt đầu session để quản lý thông tin người dùng
session_start();

// Kiểm tra nếu người dùng đã đăng nhập (có ID người dùng trong session)
if (isset($_SESSION['user'])) {
    $user = $_SESSION['user']; // Lấy thông tin người dùng từ session
} else {
    $user = null; // Nếu không có thông tin người dùng trong session
}

// Nếu người dùng muốn đăng xuất
if (isset($_POST['logout'])) {
    // Xóa thông tin người dùng trong session
    session_unset();
    session_destroy();
    // Chuyển hướng về trang đăng nhập
    header("Location: login.php");
    exit();
}
?>

    <script>
        // Hàm định dạng số dư
        function formatCash(amount) {
            return amount.toLocaleString('vi-VN', { style: 'currency', currency: 'VND' });
        }

        // Chèn dữ liệu vào trang (dữ liệu từ PHP)
        const user = <?php echo json_encode($user); ?>;

        // Kiểm tra nếu có dữ liệu người dùng
        if (user) {
            // Cập nhật các phần tử với dữ liệu người dùng
            document.getElementById('userID').textContent = user.id;
            document.getElementById('userName').textContent = user.username;
            document.getElementById('userEmail').textContent = user.email;
            document.getElementById('userBalance').textContent = formatCash(user.money);
            document.getElementById('userGroup').textContent = user.group_name;
            document.getElementById('userJoinDate').textContent = user.createdate;

            // Thay đổi ảnh đại diện người dùng
            document.querySelector('.avatar').src = user.avatar_url;
        } else {
            console.error("Không có thông tin người dùng.");
        }
    </script>
