<script>
    const dogs = [
  { weight: 22, curFood: 250, owners: ['Alice', 'Bob'] },
  { weight: 8, curFood: 200, owners: ['Matilda'] },
  { weight: 13, curFood: 275, owners: ['Sarah', 'John'] },
  { weight: 32, curFood: 340, owners: ['Michael'] },
];

// 1. Thêm thuộc tính "recommendedFood" cho mỗi chú chó
dogs.forEach(dog => {
  dog.recommendedFood = Math.trunc(dog.weight ** 0.75 * 28);
});

// 2. Tìm chú chó của Sarah và in ra xem chú chó đó ăn quá nhiều hay quá ít
const sarahsDog = dogs.find(dog => dog.owners.includes('Sarah'));
console.log(
  `Sarah's dog is eating too ${
    sarahsDog.curFood > sarahsDog.recommendedFood ? 'much' : 'little'
  }`
);

// 3. Tạo mảng chủ của các chú chó ăn quá nhiều và ăn quá ít
const ownersEatTooMuch = dogs
  .filter(dog => dog.curFood > dog.recommendedFood)
  .flatMap(dog => dog.owners);
const ownersEatTooLittle = dogs
  .filter(dog => dog.curFood < dog.recommendedFood)
  .flatMap(dog => dog.owners);

// 4. In ra chuỗi cho mỗi mảng ở yêu cầu 3
console.log(`${ownersEatTooMuch.join(' and ')}'s dogs eat too much!`);
console.log(`${ownersEatTooLittle.join(' and ')}'s dogs eat too little!`);

// 5. Kiểm tra có chú chó nào ăn chính xác bằng khẩu phần đề nghị không
console.log(dogs.some(dog => dog.curFood === dog.recommendedFood));

// 6. Kiểm tra có chú chó nào ăn ở mức hợp lý không (trong khoảng 90% và 110% khẩu phần đề nghị)
const isEatingOkay = dog =>
  dog.curFood > dog.recommendedFood * 0.9 &&
  dog.curFood < dog.recommendedFood * 1.1;
console.log(dogs.some(isEatingOkay));

// 7. In ra mảng các chú chó có khẩu phần ăn hợp lý
const dogsEatingOkay = dogs.filter(isEatingOkay);
console.log(dogsEatingOkay);

// 8. Tạo mảng mới sắp xếp theo khẩu phần ăn đề nghị tăng dần
const sortedDogs = dogs.slice().sort((a, b) => a.recommendedFood - b.recommendedFood);
console.log(sortedDogs);

</script>
