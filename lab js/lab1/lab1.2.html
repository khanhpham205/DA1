<script>
const game = {
  team1: 'Bayern Munich',
  team2: 'Dortmund',
  players: [
    [
      'Neuer', 'Pavard', 'Martinez', 'Alaba', 'Davies',
      'Kimmich', 'Goretzka', 'Coman', 'Muller', 'Gnabry', 'Lewandowski'
    ],
    [
      'Burki', 'Schulz', 'Hummels', 'Akanji', 'Hakimi',
      'Weigl', 'Witsel', 'Hazard', 'Brandt', 'Sancho', 'Gotze'
    ],
  ],
  score: '4:0',
  scored: ['Davies', 'Muller', 'Lewandowski', 'Kimmich'],
  odds: {
    team1: 1.33,
    draw: 3.25,
    team2: 6.5,
  },
};

// 1. Lặp mảng game.scored và in ra cầu thủ cùng với số bàn thắng
game.scored.forEach((player, index) => {
  console.log(`Goal ${index + 1}: ${player}`);
});

// 2. Tính tỉ lệ kết quả trận đấu và in ra console
const oddsValues = Object.values(game.odds);
const averageOdd = oddsValues.reduce((acc, odd) => acc + odd, 0) / oddsValues.length;
console.log(`Tỉ lệ kết quả trung bình: ${averageOdd.toFixed(2)}`);

// 3. In tỉ lệ thắng cho mỗi kết quả với định dạng đẹp
for (const [team, odd] of Object.entries(game.odds)) {
  const teamStr = team === 'team1' ? `Tỉ lệ thắng của ${game.team1}` 
                  : team === 'team2' ? `Tỉ lệ thắng của ${game.team2}` 
                  : 'Tỉ lệ hòa of draw';
  console.log(`${teamStr}: ${odd}`);
}

// 4. Tạo đối tượng 'scorers' để đếm số bàn thắng của mỗi cầu thủ
const scorers = {};
for (const player of game.scored) {
  scorers[player] = (scorers[player] || 0) + 1;
}
console.log(scorers);

const flights =
'_Delayed_Departure;fao93766109;txl2133758440;11:25+_Arrival;bru0943384722;fao93766109;11:45+_Delayed_Arrival;hel7439299980;fao93766109;12:05+_Departure;fao93766109;lis2323639855;12:30';
// 🔴 Delayed Departure from FAO to TXL (11h25)
// Arrival from BRU to FAO (11h45)
// 🔴 Delayed Arrival from HEL to FAO (12h05)
// Departure from FAO to LIS (12h30)
const getCode = str => str.slice(0, 3).toUpperCase();
for (const flight of flights.split('+')) {
const [type, from, to, time] = flight.split(';');
const output = `${type.startsWith('_Delayed') ? '🔴' : ''}${type.replaceAll(
'_',
' '
)} ${getCode(from)} ${getCode(to)} (${time.replace(':', 'h')})`.padStart(36);
console.log(output);
}
</script>
